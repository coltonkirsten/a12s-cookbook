name: check
on: pull_request
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: npm install
      - run: npm run check
      - uses: astral-sh/setup-uv@v6
      - run: uv run --with a12s python -m py_compile examples/*/*.py
