# One Claude Code agent with Chromium on its computer. The image is yours (Dockerfile, FROM a12s slim); the seccomp
# profile is the one extra permission Chromium's own sandbox needs, and only this file can grant it.
apiVersion: a12s.ai/v1alpha1
kind: Fleet
metadata: { name: browser-agent }

computers:
  browser:
    harness: { kind: claude-code, version: 2.1.280, model: claude-haiku-4-5 }
    image: a12s-cookbook/browser-agent:1          # docker build -t a12s-cookbook/browser-agent:1 .
    security: { seccomp: ./profiles/chromium.json }
    credentials: [anthropic]
    egress: { allow: [api.anthropic.com, example.com] }
